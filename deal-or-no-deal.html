<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Deal or No Deal | Pineapple Lounge</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#102d1c,#1e5a35);color:#fff;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.home,button{font:inherit}.home{color:#fff;text-decoration:none}.title{text-align:center;margin:10px 0}.title h1{margin:0;font-size:clamp(30px,7vw,54px)}.status{text-align:center;background:#ffffff16;padding:12px;border-radius:14px;margin:15px 0;font-weight:700}.layout{display:grid;grid-template-columns:170px 1fr 170px;gap:16px}.money{display:grid;gap:6px}.cash{background:#f5d65b;color:#17251d;padding:7px;border-radius:7px;text-align:center;font-weight:900}.cash.gone{opacity:.2;text-decoration:line-through}.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start}.box{border:0;border-radius:12px;background:linear-gradient(#ffe36d,#dcae1d);color:#17251d;padding:17px 4px;font-size:20px;font-weight:950;box-shadow:0 4px 0 #9d7610;cursor:pointer}.box.open{visibility:hidden}.box.mine{background:#fff;color:#1f6f43;box-shadow:0 4px 0 #bbb}.controls{text-align:center;margin:20px 0}.controls button{border:0;border-radius:12px;padding:12px 16px;font-weight:850;margin:4px;cursor:pointer}.banker{display:none;background:#fff8d9;color:#17251d;border-radius:20px;padding:22px;text-align:center;margin:18px auto;max-width:550px}.offer{font-size:42px;font-weight:950;margin:8px}.deal{background:#2d8a52;color:white}.nodeal{background:#c94242;color:white}.reset{background:#eee;color:#222}.reveal{font-size:24px;font-weight:900}.mobilemoney{display:none}.tiny{opacity:.75;font-size:13px;text-align:center}@media(max-width:750px){.layout{grid-template-columns:1fr}.money{display:none}.mobilemoney{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}.mobilemoney .cash{font-size:11px;padding:5px 2px}.boxes{grid-template-columns:repeat(4,1fr)}.box{padding:16px 2px}.top{font-size:14px}}
</style></head><body><div class="wrap">
<div class="top"><a class="home" href="index.html">← Games Hub</a><button class="reset" onclick="newGame()">New Game</button></div>
<div class="title"><div>🍍 THE PINEAPPLE LOUNGE</div><h1>💰 Deal or No Deal</h1></div>
<div id="status" class="status">Choose YOUR box to keep until the end.</div>
<div id="mobilemoney" class="mobilemoney"></div>
<div class="layout"><div id="leftMoney" class="money"></div><div id="boxes" class="boxes"></div><div id="rightMoney" class="money"></div></div>
<div id="banker" class="banker"><div>☎️ THE BANKER IS CALLING</div><div id="offer" class="offer">£0</div><div>DEAL OR NO DEAL?</div><button class="deal" onclick="takeDeal()">🤝 DEAL</button><button class="nodeal" onclick="noDeal()">❌ NO DEAL</button></div>
<div id="ending" class="controls"></div><p class="tiny">Pineapple Lounge edition • Values are shuffled for every new game.</p>
</div>
<script>
if(sessionStorage.getItem('pineappleAccess')!=='yes') location.replace('index.html');
const values=[1,10,50,100,250,500,750,1000,3000,5000,10000,15000,20000,35000,50000,75000,100000,150000,200000,250000,500000,1000000];
const rounds=[5,3,3,3,3,2,1,1];let boxValues={},chosen=null,opened=[],round=0,toOpen=rounds[0],gameOver=false,offerNow=0;
const fmt=n=>'£'+n.toLocaleString('en-GB');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){const s=shuffle(values);boxValues={};for(let i=1;i<=22;i++)boxValues[i]=s[i-1];chosen=null;opened=[];round=0;toOpen=rounds[0];gameOver=false;offerNow=0;document.getElementById('banker').style.display='none';document.getElementById('ending').innerHTML='';render();status('Choose YOUR box to keep until the end.')}
function status(t){document.getElementById('status').textContent=t}
function moneyHTML(v){return '<div class="cash '+(opened.some(n=>boxValues[n]===v)?'gone':'')+'">'+fmt(v)+'</div>'}
function renderMoney(){const half=11;document.getElementById('leftMoney').innerHTML=values.slice(0,half).map(moneyHTML).join('');document.getElementById('rightMoney').innerHTML=values.slice(half).map(moneyHTML).join('');document.getElementById('mobilemoney').innerHTML=values.map(moneyHTML).join('')}
function render(){renderMoney();let h='';for(let i=1;i<=22;i++){let cls='box'+(opened.includes(i)?' open':'')+(chosen===i?' mine':'');h+='<button class="'+cls+'" onclick="pick('+i+')" '+(gameOver?'disabled':'')+'>'+(chosen===i?'🍍 '+i:i)+'</button>'}document.getElementById('boxes').innerHTML=h}
function pick(n){if(gameOver||opened.includes(n))return;if(chosen===null){chosen=n;render();status('Box '+n+' is yours. Open '+toOpen+' boxes.');return}if(n===chosen)return;opened.push(n);const v=boxValues[n];render();toOpen--;status('Box '+n+': '+fmt(v)+' — '+(toOpen?toOpen+' more box'+(toOpen===1?'':'es')+' to open.':'Round complete.'));if(toOpen===0)setTimeout(callBanker,450)}
function remaining(){return Object.keys(boxValues).map(Number).filter(n=>!opened.includes(n))}
function callBanker(){const vals=remaining().map(n=>boxValues[n]);const avg=vals.reduce((a,b)=>a+b,0)/vals.length;const progress=opened.length/21;const factor=.45+progress*.45;offerNow=Math.max(1,Math.round((avg*factor)/10)*10);document.getElementById('offer').textContent=fmt(offerNow);document.getElementById('banker').style.display='block';status('☎️ The Banker has made an offer.')}
function noDeal(){document.getElementById('banker').style.display='none';round++;const rem=remaining();if(rem.length<=2){finalChoice();return}toOpen=rounds[Math.min(round,rounds.length-1)];toOpen=Math.min(toOpen,rem.length-2);status('NO DEAL! Open '+toOpen+' box'+(toOpen===1?'':'es')+'.')}
function takeDeal(){gameOver=true;document.getElementById('banker').style.display='none';const own=boxValues[chosen];status('🤝 DEAL at '+fmt(offerNow)+'!');document.getElementById('ending').innerHTML='<div class="reveal">Your box '+chosen+' contained '+fmt(own)+'.</div><button class="reset" onclick="newGame()">Play Again</button>';render()}
function finalChoice(){const other=remaining().find(n=>n!==chosen);status('Two boxes remain: yours and box '+other+'.');document.getElementById('ending').innerHTML='<div class="reveal">Final choice</div><button class="deal" onclick="finish(false)">KEEP BOX '+chosen+'</button><button class="nodeal" onclick="finish(true)">SWAP TO BOX '+other+'</button>'}
function finish(swap){const other=remaining().find(n=>n!==chosen);const finalBox=swap?other:chosen;gameOver=true;status(swap?'You swapped boxes!':'You kept your box!');document.getElementById('ending').innerHTML='<div class="reveal">🎉 You won '+fmt(boxValues[finalBox])+'!</div><div>Your original box '+chosen+' had '+fmt(boxValues[chosen])+'.</div><button class="reset" onclick="newGame()">Play Again</button>';render()}
newGame();
</script></body></html>
