<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Transformation Thursday | Pineapple Lounge</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#31543a,#102019 55%,#0b1711);color:#fff8e8;font:16px system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px 16px 60px}a{color:#f3c84b}.back{display:inline-block;margin:0 0 28px;text-decoration:none}h1{font-size:clamp(28px,6vw,46px);margin:0 0 12px}header p{color:#c9d7c2;line-height:1.6;margin-bottom:30px}.card{background:#20382b;border:1px solid #5b7655;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 30px #0003}.card h2{margin:0 0 12px;font-size:23px}.prompt{white-space:pre-wrap;line-height:1.65;color:#f2f2e9;margin:0 0 20px;overflow-wrap:anywhere}button{background:#f3c84b;color:#18271c;border:0;border-radius:10px;padding:13px 20px;font:800 15px system-ui;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.hint{color:#b9cbb6;font-size:13px;margin-top:25px}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Back to Games Hub</a><header><h1>🎭 Transformation Thursday</h1><p>Pick a theme, copy the prompt and paste it into your AI image generator along with your photo. No typing needed!</p></header><section aria-label="Transformation prompts" id="prompts"></section><p class="hint">🍍 More themes will be added here as they're created.</p></main>
<script>
const prompts=[
{title:"🚔 Grand Theft Auto",text:"Transform the person in the uploaded photo into a character from a Grand Theft Auto-style video game, keeping their recognisable facial features. Use dramatic illustrated video-game cover art styling, bold colours, cinematic lighting and an urban backdrop."}
];
const root=document.getElementById("prompts");
for(const item of prompts){const card=document.createElement("article");card.className="card";const title=document.createElement("h2");title.textContent=item.title;const prompt=document.createElement("p");prompt.className="prompt";prompt.textContent=item.text;const button=document.createElement("button");button.type="button";button.textContent="📋 Copy prompt";button.setAttribute("aria-label","Copy "+item.title+" prompt");button.addEventListener("click",async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(item.text)}else{const t=document.createElement("textarea");t.value=item.text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();if(!document.execCommand("copy"))throw Error("Copy failed");t.remove()}button.textContent="✓ Copied!";setTimeout(()=>button.textContent="📋 Copy prompt",2000)}catch(e){button.textContent="Select text above to copy";prompt.setAttribute("tabindex","0");prompt.focus()}});card.append(title,prompt,button);root.append(card)}
</script></body></html>
