<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pineapple Games Wheel</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#08150e,#12351f);color:white}.wrap{max-width:720px;margin:auto;padding:18px;text-align:center}.back{display:block;text-align:left;color:#fff}.fruit{font-size:44px;margin-top:12px}h1{color:#ffd84d;margin:3px 0 0;font-size:clamp(32px,8vw,52px)}p{opacity:.8}.wheelbox{position:relative;max-width:540px;margin:24px auto}.pointer{font-size:38px;position:absolute;z-index:3;top:-28px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 2px 2px #000)}canvas{width:100%;height:auto;display:block;border-radius:50%;border:8px solid #fff8e7;box-shadow:0 18px 50px #0008}.spin{margin-top:20px;width:min(100%,420px);padding:17px;border:0;border-radius:15px;background:#ffd84d;color:#17251d;font-size:22px;font-weight:950}.spin:disabled{opacity:.6}.result{min-height:74px;margin:18px auto 4px;background:#fffdf5;color:#17251d;border-radius:18px;padding:14px;max-width:540px}.result small{display:block;opacity:.65}.result strong{display:block;font-size:25px;margin-top:4px}.games{font-size:13px;opacity:.7;max-width:600px;margin:18px auto;line-height:1.6}@media(prefers-reduced-motion:reduce){canvas{transition:none!important}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Games Hub</a><div class="fruit">🍍🎡</div><h1>Pineapple Games Wheel</h1><p>Can't decide what to play? Let the pineapple choose.</p><div class="wheelbox"><div class="pointer">▼</div><canvas id="wheel" width="700" height="700" aria-label="Wheel of Pineapple games"></canvas></div><button id="spin" class="spin">SPIN THE WHEEL</button><div class="result" aria-live="polite"><small>THE WHEEL CHOOSES…</small><strong id="result">Ready to spin 🍍</strong></div><div class="games" id="list"></div></main><script>if(sessionStorage.getItem('pineappleAccess')!=='yes')location.replace('index.html');const games=["Mystery Monday","Wrong 'Un Monday","Choo Choo Choose Tuesday","Tunes Tuesday","Where's Scotty?","Workshop Wednesday","Throw the Dice Thursday","Transform Thursday","Thank GIF It's Friday","One Word Friday","Snap It Saturday","Sell It Saturday","Showdown Saturday","Sunday Roast","Say It Sunday","Speed Chat","Member Takeover","Pass the Pineapple","Pineapple Fortunes","Pineapple Creative","Porky Pineapple","Pineapple Pursuit","Caption This!","Voice Note Roulette","Who Am I?","Zoom In!","Name That Tune!","Pineapple Puzzle","Lucky Dip","Wheel of Misfortune","Truth or Dare Roulette","Travel Roulette","Telly Roulette","Porky Pineapple Roulette","Mystery Wheel","GIF Roulette","Impression Roulette","Wheel Knockout","Banker's Wheel","Mystery Prize Wheel","King/Queen for a Round","Showdown Roulette","Hot Seat Roulette","Sunday Roast Roulette","Six of…","Monday Mayhem"];const cvs=document.getElementById('wheel'),ctx=cvs.getContext('2d'),btn=document.getElementById('spin'),out=document.getElementById('result');let angle=0,spinning=false;const colors=['#ffd84d','#2d8a52','#f08a5d','#6c7ae0','#e85d75','#56b4a9'];function draw(a=angle){const cx=350,cy=350,r=330,s=2*Math.PI/games.length;ctx.clearRect(0,0,700,700);ctx.save();ctx.translate(cx,cy);ctx.rotate(a);games.forEach((g,i)=>{ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,i*s,(i+1)*s);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff8e7';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.rotate((i+.5)*s);ctx.textAlign='right';ctx.fillStyle='#102016';ctx.font='bold 13px system-ui';let t=g.length>22?g.slice(0,20)+'…':g;ctx.fillText(t,r-18,5);ctx.restore()});ctx.restore();ctx.beginPath();ctx.arc(cx,cy,58,0,Math.PI*2);ctx.fillStyle='#fff8e7';ctx.fill();ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍍',cx,cy)}function spin(){if(spinning)return;spinning=true;btn.disabled=true;out.textContent='Spinning…';const start=angle,target=angle+(Math.PI*2*(5+Math.random()*4))+Math.random()*Math.PI*2,dur=4200,t0=performance.now();function frame(now){let p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);angle=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(frame);else{const s=2*Math.PI/games.length;let pointer=(-Math.PI/2-angle)%(Math.PI*2);if(pointer<0)pointer+=Math.PI*2;const i=Math.floor(pointer/s)%games.length;out.textContent=games[i];spinning=false;btn.disabled=false}}requestAnimationFrame(frame)}btn.addEventListener('click',spin);document.getElementById('list').textContent=games.join(' • ');draw();</script></body></html>
