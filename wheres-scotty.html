<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Where's Scotty? | Pineapple Lounge</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#071f36;color:#fff}.wrap{max-width:1000px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between}.top a{color:#fff}.hero{text-align:center}.hero h1{font-size:clamp(34px,8vw,64px);margin:10px 0;color:#ffd452}.game{display:grid;grid-template-columns:2fr 1fr;gap:16px}.scene{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#3d91ac;border:4px solid white}.houses{position:absolute;inset:0 0 42% 0;background:linear-gradient(90deg,#c75d3c 0 18%,#f0b44c 18% 35%,#8c4c38 35% 52%,#d9794c 52% 69%,#e8c070 69% 84%,#b85d45 84%)}.water{position:absolute;inset:58% 0 0;background:linear-gradient(#3d91ac,#194b6c)}.bridge{position:absolute;left:18%;right:18%;top:50%;height:8%;background:#49372c;border-radius:50% 50% 0 0}.bike{position:absolute;bottom:12%;left:12%;font-size:52px}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}.tile{border:1px solid #ffffffaa;background:#08263bee;color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:.3s}.tile.revealed{opacity:0}.side{display:grid;gap:12px;align-content:start}.card{background:#fff;color:#17251d;border-radius:16px;padding:16px}.card h3{margin:0 0 8px}.btns{display:grid;gap:8px}.btn{border:0;border-radius:12px;padding:13px;font-weight:850;font-size:16px}.yellow{background:#ffd452}.green{background:#2d8a52;color:white}.grey{background:#e9ecef}.guess{width:100%;padding:12px;border:2px solid #ccd5da;border-radius:10px;font-size:16px;margin:6px 0}.msg{font-weight:750;min-height:25px}.mode{text-align:center;margin-top:14px;opacity:.75}@media(max-width:720px){.game{grid-template-columns:1fr}.scene{aspect-ratio:1/1}.tile{font-size:22px}}</style></head><body><main class="wrap">
<div class="top"><a href="index.html">← Games Hub</a><strong>🍍 Pineapple Lounge</strong></div><div class="hero"><h1>🕵️ WHERE'S SCOTTY?</h1><p>Find Scotty and work out where he's hiding.</p></div>
<div class="game"><div class="scene" style="background-image:url('https://images.pexels.com/photos/3452826/pexels-photo-3452826.jpeg?auto=compress&cs=tinysrgb&w=1200');background-size:cover;background-position:center"><div id="tiles" class="tiles"></div></div>
<div class="side"><section class="card"><h3>🎮 Live Round</h3><strong>20 squares · synced for everyone</strong><p id="remaining"></p><p id="countdown" class="msg"></p></section>
<section class="card"><h3>📍 Where am I?</h3><form id="guessForm"><input id="guess" class="guess" autocomplete="off" placeholder="Type your guess…"><button class="btn green" style="width:100%">SUBMIT GUESS</button></form><div id="msg" class="msg" aria-live="polite"></div></section></div></div><div class="mode">Live round · the same squares disappear for everyone.</div></main>
<script>
const ROUND_START='2099-01-01T00:00:00Z';
const REVEAL_MS=5*60*1000;
const ORDER=[7,14,2,19,10,4,17,12,1,16,8,20,5,13,3,18,11,6,15,9];
const tiles=document.getElementById('tiles'),rem=document.getElementById('remaining'),msg=document.getElementById('msg'),countdown=document.getElementById('countdown');
function draw(){
  tiles.innerHTML='';
  const start=new Date(ROUND_START).getTime(),now=Date.now();
  const revealed=now<start?1:Math.min(20,1+Math.floor((now-start)/REVEAL_MS));
  const open=new Set(ORDER.slice(0,revealed));
  for(let i=1;i<=20;i++){const d=document.createElement('div');d.className='tile'+(open.has(i)?' revealed':'');d.textContent=i;tiles.appendChild(d)}
  rem.textContent=(20-revealed)+' squares covered · '+revealed+' revealed';
  if(revealed<20){
    if(now<start){countdown.textContent='Round ready to start';}
    else{const next=start+revealed*REVEAL_MS;const secs=Math.max(0,Math.ceil((next-now)/1000));countdown.textContent='Next square in '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');}
  }else countdown.textContent='All squares revealed';
}
document.getElementById('guessForm').onsubmit=e=>{e.preventDefault();const g=document.getElementById('guess').value.trim().toLowerCase();if(!g){msg.textContent='Enter a guess first.';return}msg.textContent=g.includes('lisbon')||g.includes('lisboa')?'🎉 Correct — Lisbon!':'❌ Not this time — keep looking!'};
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
draw();setInterval(draw,1000);
</script></body></html>
