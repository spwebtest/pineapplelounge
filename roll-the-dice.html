<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Roll the Dice | Pineapple Lounge</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#fff3b0,#dff2d7);color:#17251d;min-height:100vh}.wrap{max-width:600px;margin:auto;padding:22px;text-align:center}.home{display:block;text-align:left;color:#1f6f43;text-decoration:none;font-weight:700}.fruit{font-size:48px;margin-top:28px}h1{font-size:clamp(36px,10vw,62px);margin:5px 0}.card{background:#fffdf5;border-radius:26px;padding:28px 20px;margin-top:22px;box-shadow:0 15px 40px #244b2b22}.die{font-size:130px;line-height:1.1;min-height:150px;display:flex;align-items:center;justify-content:center}.num{font-size:82px;font-weight:950;line-height:1;margin:10px}.roll{width:100%;border:0;border-radius:16px;background:#1f6f43;color:white;padding:18px;font-size:21px;font-weight:900;cursor:pointer}.roll:active{transform:scale(.98)}p{opacity:.7}.rolling{animation:shake .12s linear 4}@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){.rolling{animation:none}}</style></head><body><main class="wrap"><a class="home" href="index.html">← Games Hub</a><div class="fruit">🍍</div><h1>🎲 Roll the Dice</h1><p>One roll. One number. 1–6.</p><section class="card"><div id="die" class="die">🎲</div><div id="num" class="num">?</div><button id="roll" class="roll">ROLL THE DICE</button></section></main><script>if(sessionStorage.getItem('pineappleAccess')!=='yes')location.replace('index.html');const d=document.getElementById('die'),n=document.getElementById('num'),b=document.getElementById('roll');b.addEventListener('click',()=>{b.disabled=true;d.classList.remove('rolling');void d.offsetWidth;d.classList.add('rolling');n.textContent='…';setTimeout(()=>{n.textContent=Math.floor(Math.random()*6)+1;b.disabled=false},500)});</script></body></html>
