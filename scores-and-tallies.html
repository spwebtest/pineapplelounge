<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>🍍 Scores & Tallies | Pineapple Lounge</title>
<style>:root{font-family:system-ui,sans-serif;color:#183024;background:#0d2015}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:24px}header{text-align:center;color:#fff8d7;padding:18px 0 24px}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}h2{margin:0 0 14px}a{color:#ffe27a}header p{opacity:.8}.panel{background:#fffdf2;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 10px 25px #0003}.muted{color:#526354}.warning{background:#fff3c8;border-radius:10px;padding:10px 13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e2e8d9;padding:10px 6px}th:last-child,td:last-child{text-align:right}.scroll{overflow-x:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button{border:0;border-radius:12px;padding:11px 16px;background:#e8efdc;cursor:pointer;font-weight:700}.tabs button.active{background:#237449;color:white}.race{padding:10px 0;border-bottom:1px solid #ddd}small{color:#56665a}.back{display:inline-block;margin-bottom:8px}.hide{display:none}</style></head>
<body><main><header><a class="back" href="index.html">← Games Hub</a><h1>🍍 Scores & Tallies</h1><p>All-time Pineapple game results, powered by our saved history</p></header>
<div class="panel"><div class="tabs"><button class="active" data-tab="showdown">🏆 Saturday Showdown</button><button data-tab="horses">🐎 Horse Racing</button><button data-tab="other">🎲 Other Games</button></div><p id="status" class="muted" role="status">Loading historical results…</p></div>
<section id="showdown" class="panel"><h2>🏆 Saturday Showdown</h2><div id="showdownData"></div></section>
<section id="horses" class="panel hide"><h2>🐎 Pineapple Grand National</h2><div id="horseData"></div></section>
<section id="other" class="panel hide"><h2>🎲 Other Games</h2><div id="otherData"><p>Loading game history…</p></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['showdown','horses','other'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.tab))});
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function load(){try{const r=await fetch('data/results/events.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const meta=d.game_metadata||{},sm=meta['saturday-showdown']||{},hm=meta['horse-racing']||{};const weeks=d.events.filter(e=>e.game_id==='saturday-showdown'),races=d.events.filter(e=>e.game_id==='horse-racing').sort((a,b)=>Number(a.id.split('-').pop())-Number(b.id.split('-').pop()));
let participation=null;try{const pr=await fetch('data/results/participation.json?ts='+Date.now(),{cache:'no-store'});if(pr.ok)participation=await pr.json()}catch(e){console.warn('Participation unavailable',e)}
let s='<h3>Overall leaderboard · Weeks 1–3</h3>'+table(['Rank','Player','Points'],(sm.cumulative_leaderboard_top_3||[]).map(p=>[p.rank,p.name,p.points]));s+='<p class="warning">Historical records are incomplete: only confirmed top-three cumulative scores are shown.</p>';if(participation){s+='<h3>Weekly participation</h3>'+table(['Player','Week 1','Week 2','Week 3'],participation.players.map(p=>[p.name,...participation.weeks.map(w=>p.weeks[w]?.participated===true?'✓ Played':p.weeks[w]?.participated===false?'— Absent':'? Unverified')]));s+='<small>✓ means at least one confirmed vote. ? means the screenshot records have not been fully checked, not that the player was absent. Poll counts and accuracy will appear when verified.</small>';}for(const w of weeks){s+='<h3>'+esc(w.label)+'</h3>';if(w.winners)s+='<p><strong>Winners:</strong> '+w.winners.map(x=>esc(x.name)+' ('+esc(x.type)+')').join(', ')+'</p>';if(w.joint_winners)s+='<p><strong>Joint winners:</strong> '+w.joint_winners.map(esc).join(', ')+'</p>';if(w.winning_answers)s+='<p><strong>Winning answers:</strong> '+w.winning_answers.map(esc).join(' · ')+'</p>';if(w.polls)s+=table(['Poll','Winning answer','Winning %'],w.polls.map(p=>[p.number,p.winning_answer,p.winning_percentage+'%']));if(w.missing?.length)s+='<small>Still missing: '+w.missing.map(esc).join(', ')+'</small>'}$('showdownData').innerHTML=s;
let h='<h3>Championship standings</h3>'+table(['Rank','Horse','Points'],(hm.final_standings||[]).map((p,i)=>[i+1,p.name,p.points]));h+='<p class="warning">Standings reflect the recorded championship totals. Full finishing orders beyond the podiums are not available.</p><h3>Race-by-race podiums</h3>';for(const race of races){h+='<div class="race"><strong>'+esc(race.label)+'</strong>'+table(['Position','Horse','Points'],(race.podium||[]).map(p=>[p.position,p.name,p.points]));if(race.eliminated_after_race?.length)h+='<small>Eliminated: '+race.eliminated_after_race.map(esc).join(', ')+'</small>';h+='</div>'}h+='<h3>Original 12 horses</h3><p>'+((hm.original_horses||[]).map(esc).join(' · '))+'</p>';$('horseData').innerHTML=h;const deals=d.events.filter(e=>e.game_id==='deal-or-no-deal').sort((a,b)=>a.date.localeCompare(b.date));let other='<h3>💰 Deal or No Deal</h3>';if(deals.length){other+=table(['Game','Original box','Final box','Final value','Final banker offer'],deals.map(g=>[g.label+' · '+g.date,g.original_box,g.final_box,'£'+Number(g.final_box_value_gbp).toLocaleString('en-GB'),'£'+Number(g.final_banker_offer_gbp).toLocaleString('en-GB')]));for(const g of deals){other+='<p><strong>'+esc(g.label)+':</strong> '+esc(g.outcome)+'. Other remaining box '+esc(g.other_final_box)+' held £'+Number(g.other_final_box_value_gbp).toLocaleString('en-GB')+'.</p>'}other+='<p class="warning">Earlier banker offers and complete box-by-box eliminations still need verification.</p>'}else{other+='<p>No saved Deal or No Deal results yet.</p>'}other+='<h3>🧳 Location Guessing &amp; Mystery Monday</h3><p>Detailed historical results awaiting import.</p>';$('otherData').innerHTML=other;$('status').textContent='Historical results loaded from the Pineapple GitHub database.'}catch(e){$('status').textContent='Could not load the saved results. Please refresh the page.';console.error(e)}}
load();
</script></body></html>
