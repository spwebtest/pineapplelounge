<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏇 Pineapple Grand National</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c24;color:#fff;font-family:system-ui,Arial;text-align:center}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:clamp(25px,5vw,42px);margin:12px 0}p{color:#d5e6dd}.panel{background:#20323d;padding:16px;border-radius:14px;margin:14px auto;max-width:620px}textarea{width:100%;height:130px;background:#f7faf9;color:#14242c;border:0;border-radius:8px;padding:12px;font:16px system-ui}button{background:#f9c846;color:#15222a;border:0;padding:13px 24px;border-radius:10px;font-weight:800;font-size:17px;cursor:pointer;margin:6px}button:disabled{opacity:.5}#track{background:#326d43;border:5px solid #e9d5a0;border-radius:12px;overflow:hidden;margin-top:15px}.lane{height:76px;position:relative;border-bottom:2px dashed #b0d4a8;background:linear-gradient(90deg,#316b40,#3e824c)}.lane:nth-child(even){background:linear-gradient(90deg,#2b6139,#377a46)}.lane:last-child{border-bottom:0}.finish{position:absolute;right:9%;top:0;bottom:0;width:12px;background:repeating-linear-gradient(0deg,#fff 0 9px,#111 9px 18px)}.runner{position:absolute;left:0;top:7px;transform:translateX(0);will-change:transform;z-index:1}.horse{font-size:39px;display:block;line-height:43px;transform:scaleX(-1);animation:gallop .28s infinite alternate}.name{background:#101c24dd;color:white;padding:2px 8px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}@keyframes gallop{to{transform:scaleX(-1) rotate(8deg) translateY(-3px)}}#count{font-size:36px;font-weight:900;min-height:50px;color:#ffd65b}#results{font-size:22px;line-height:1.7}#results strong{color:#ffdf69}small{color:#c6d6cd}body.racing .panel{display:none}@media(max-width:600px){.lane{height:67px}.horse{font-size:34px}.name{font-size:12px}.runner{top:5px}main{padding:9px}body.racing h1{font-size:25px}}.horse{width:74px;height:42px;position:relative;display:block;transform:none;animation:horse-bob .34s ease-in-out infinite alternate;line-height:normal}.horse svg{width:74px;height:42px;overflow:visible}.horse .leg-front{transform-origin:53px 24px;animation:front-leg .28s ease-in-out infinite alternate}.horse .leg-back{transform-origin:22px 24px;animation:back-leg .28s ease-in-out infinite alternate}.horse .tail{transform-origin:11px 17px;animation:tail-swish .4s ease-in-out infinite alternate}@keyframes horse-bob{to{transform:translateY(-3px)}}@keyframes front-leg{to{transform:rotate(35deg)}}@keyframes back-leg{to{transform:rotate(-35deg)}}@keyframes tail-swish{to{transform:rotate(-25deg)}}</style></head><body><main><h1>🍍🏇 Pineapple Grand National</h1><p>Random horse racing — made for screen recording!</p><div class="panel" id="setup"><label for="names">Enter one racer per line</label><textarea id="names">Scott\nLisa\nCharlie\nLauren\nJenn\nAngie</textarea><p><label>Race length <select id="duration"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="60">60 seconds</option></select></label></p><button id="start">🏁 Start race</button></div><div id="count" aria-live="polite"></div><div id="track"></div><div id="results" aria-live="polite"></div><button id="again" hidden>🔄 Race again</button><button id="edit" hidden>✏️ Edit names</button></main><script>
const $=id=>document.getElementById(id);let racers=[],frame=0,active=false;
function randomOrder(n){let a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){cancelAnimationFrame(frame);active=false;racers=$('names').value.split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,24).map(name=>({name}));if(racers.length<2){alert('Enter at least two names');return false}let track=$('track');track.replaceChildren();racers.forEach((r,i)=>{let lane=document.createElement('div');lane.className='lane';let finish=document.createElement('div');finish.className='finish';let runner=document.createElement('div');runner.className='runner';let horse=document.createElement('span');horse.className='horse';horse.innerHTML="<svg viewBox=\"0 0 90 52\" aria-hidden=\"true\"><g class=\"tail\"><path d=\"M16 18 Q2 10 4 30 Q11 25 17 24\" fill=\"var(--mane)\"/></g><g class=\"leg-back\"><path d=\"M25 28 L20 43 L11 48\" fill=\"none\" stroke=\"var(--coat)\" stroke-width=\"7\" stroke-linecap=\"round\"/></g><g class=\"leg-front\"><path d=\"M58 27 L65 41 L76 46\" fill=\"none\" stroke=\"var(--coat)\" stroke-width=\"7\" stroke-linecap=\"round\"/></g><ellipse cx=\"39\" cy=\"22\" rx=\"29\" ry=\"14\" fill=\"var(--coat)\"/><path d=\"M58 19 L66 3 L76 8 L73 23\" fill=\"var(--coat)\"/><path d=\"M69 5 L69 0 L75 4\" fill=\"var(--coat)\"/><path d=\"M72 14 L85 16 L83 24 L71 22\" fill=\"var(--coat)\"/><path d=\"M59 14 L65 3 L69 7 L65 20\" fill=\"var(--mane)\"/><circle cx=\"76\" cy=\"13\" r=\"1.8\" fill=\"#171717\"/><path d=\"M18 12 Q38 4 54 12\" fill=\"none\" stroke=\"var(--mane)\" stroke-width=\"4\"/></svg>";const coats=['#9b552e','#30333b','#ddd9ce','#ba693c','#8a8c91','#5d352b','#e2b777','#754a35'];horse.style.setProperty('--coat',coats[i%coats.length]);horse.style.setProperty('--mane',i%8===2?'#888':'#34251e');let label=document.createElement('div');label.className='name';label.textContent=r.name;runner.append(horse,label);lane.append(finish,runner);track.append(lane);r.lane=lane;r.runner=runner;r.progress=0});$('results').textContent='';$('again').hidden=true;$('edit').hidden=true;return true}
function run(){if(!prepare())return;$('setup').hidden=true;document.body.classList.add('racing');$('start').disabled=true;let t=3;$('count').textContent=t;let timer=setInterval(()=>{t--;if(t>0){$('count').textContent=t}else{clearInterval(timer);$('count').textContent='🏁 GO!';race()}},1000)}
function race(){active=true;let duration=Number($('duration').value)*1000;let order=randomOrder(racers.length);let rank=Array(racers.length);order.forEach((id,i)=>rank[id]=i);let start=performance.now();let seed=racers.map(()=>Math.random()*100);function tick(now){if(!active)return;let elapsed=Math.min(1,(now-start)/duration);let eased=elapsed*elapsed*(3-2*elapsed);racers.forEach((r,i)=>{let target=.994-rank[i]*.008;let wobble=Math.sin(elapsed*22+seed[i])*.028*Math.sin(Math.PI*elapsed);let p=Math.max(0,Math.min(target,elapsed*.68+eased*(target-.68)+wobble));if(elapsed===1)p=target;r.progress=p;let max=r.lane.clientWidth*.91-r.runner.clientWidth; r.runner.style.transform='translateX('+Math.max(0,max*p/0.994)+'px)'});if(elapsed<1){frame=requestAnimationFrame(tick)}else{active=false;$('count').textContent='🏁 FINISH!';let out=document.createElement('div');let heading=document.createElement('strong');heading.textContent='🏆 '+racers[order[0]].name+' WINS!';out.append(heading,document.createElement('br'));order.slice(0,3).forEach((id,i)=>{let row=document.createElement('div');row.textContent=['🥇 ','🥈 ','🥉 '][i]+racers[id].name;out.append(row)});$('results').replaceChildren(out);$('again').hidden=false;$('edit').hidden=false;$('start').disabled=false}}frame=requestAnimationFrame(tick)}
$('start').addEventListener('click',run);$('again').addEventListener('click',run);$('edit').addEventListener('click',()=>{active=false;cancelAnimationFrame(frame);document.body.classList.remove('racing');$('setup').hidden=false;$('track').replaceChildren();$('results').textContent='';$('count').textContent='';$('again').hidden=true;$('edit').hidden=true});</script></body></html>
