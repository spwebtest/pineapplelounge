<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pineapple Catchphrase</title><style>*{box-sizing:border-box}body{margin:0;background:#102019;color:#fff8e8;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{text-align:center;color:#f3c84b}section{background:#20382b;border:1px solid #5b7655;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:10px;border-radius:9px;border:0;margin:4px;max-width:100%}button{background:#f3c84b;color:#18271c;font-weight:bold;cursor:pointer}a{color:#f3c84b}#board{position:relative;aspect-ratio:16/9;background:#fff3cf;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#183a29}#art{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(35px,12vw,110px);text-align:center}#art img,#art video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}#tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}#tiles button{margin:0;border:2px solid #f3c84b;border-radius:0;background:#28583e;color:#fff;font-size:clamp(22px,6vw,50px)}#tiles button.open{visibility:hidden}#tiles[hidden],[hidden]{display:none!important}#answer{text-align:center;font-size:24px;font-weight:bold;color:#f3c84b}body.show #host,body.show #home{display:none}body.show main{max-width:1100px}#scores div{display:flex;align-items:center;justify-content:space-between;gap:8px}label{display:block;margin-top:8px}</style></head><body><main><a id="home" href="hidden-games.html">← Host Games</a><h1>🍍 Pineapple Catchphrase</h1><section><h2 id="heading" style="text-align:center">Say what you see!</h2><div id="board"><div id="art"></div><div id="tiles" hidden></div></div><p id="answer" hidden></p><button id="back" hidden>← Back to host</button></section><section id="host"><h2>Host controls</h2><label>Choose a starter puzzle</label><select id="pick"></select><button id="load">Load puzzle</button><label>Or upload your own picture, GIF or video</label><input id="file" type="file" accept="image/*,video/*"><input id="custom" placeholder="Correct catchphrase"><button id="upload">Load custom puzzle</button><p id="secret"></p><button id="normal">Normal round</button><button id="bonus">9-square bonus</button><button id="reset">Reset squares</button><button id="reveal">Reveal answer</button><button id="show">Presentation mode</button><h2>Scoreboard</h2><input id="player" placeholder="Player name"><button id="add">Add player</button><div id="scores"></div><button id="clear">Reset scores</button></section></main><script>
if(sessionStorage.getItem('pineappleHostUnlocked')!=='yes'){location.replace('hidden-games.html')}
const $=id=>document.getElementById(id), puzzles=[['When pigs fly','🐷 ☁️ 🪽'],['Spill the beans','🥫 ↘️ 🫘'],['Elephant in the room','🛋️ 🐘 🪴'],['Time flies','🕰️ 🪽'],['Fish out of water','🐟 🏜️'],['Cold feet','🧊 🦶'],['Break the ice','🔨 🧊'],['Walking on eggshells','👣 🥚'],['A piece of cake','🍰'],['Under the weather','🌧️\n🙍'],['Money down the drain','💷 ↘️ 🕳️'],['A wolf in sheep’s clothing','🐺 🐑']];let current=puzzles[0][0],url=null,bonus=false,players=new Map();puzzles.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+p[0];$('pick').append(o)});function tiles(){ $('tiles').replaceChildren();for(let i=1;i<=9;i++){let b=document.createElement('button');b.textContent=i;b.setAttribute('aria-label','Reveal square '+i);b.onclick=()=>b.classList.add('open');$('tiles').append(b)}$('tiles').hidden=!bonus}function fresh(){ $('answer').hidden=true;$('answer').textContent=current;$('secret').textContent='Host answer: '+current;tiles()}function cleanup(){if(url){URL.revokeObjectURL(url);url=null}$('art').replaceChildren()}function load(){cleanup();let p=puzzles[Number($('pick').value)];current=p[0];$('art').textContent=p[1];$('art').style.whiteSpace='pre-line';fresh()}$('load').onclick=load;$('upload').onclick=()=>{let f=$('file').files[0],a=$('custom').value.trim();if(!f||!a){alert('Choose a file and enter its answer.');return}if(!/^(image|video)\//.test(f.type)){alert('Choose an image or video.');return}cleanup();url=URL.createObjectURL(f);let el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=url;if(el.tagName==='VIDEO'){el.autoplay=true;el.loop=true;el.muted=true;el.playsInline=true}else el.alt='Mystery picture';$('art').append(el);current=a;fresh()};$('normal').onclick=()=>{bonus=false;$('heading').textContent='Say what you see!';fresh()};$('bonus').onclick=()=>{bonus=true;$('heading').textContent='Bonus Catchphrase';fresh()};$('reset').onclick=fresh;$('reveal').onclick=()=>{$('answer').hidden=false;$('tiles').querySelectorAll('button').forEach(b=>b.classList.add('open'))};$('show').onclick=()=>{document.body.classList.add('show');$('back').hidden=false;window.scrollTo(0,0)};$('back').onclick=()=>{document.body.classList.remove('show');$('back').hidden=true};function scores(){ $('scores').replaceChildren();[...players].sort((a,b)=>b[1]-a[1]).forEach(([name,points])=>{let row=document.createElement('div'),label=document.createElement('span'),controls=document.createElement('span');label.textContent=name+' — '+points;[-1,1,3,5].forEach(n=>{let b=document.createElement('button');b.textContent=n>0?'+'+n:n;b.onclick=()=>{players.set(name,Math.max(0,players.get(name)+n));scores()};controls.append(b)});row.append(label,controls);$('scores').append(row)})}$('add').onclick=()=>{let n=$('player').value.trim();if(n&&!players.has(n)){players.set(n,0);scores()}$('player').value=''};$('clear').onclick=()=>{if(confirm('Reset all player scores?')){players.forEach((v,k)=>players.set(k,0));scores()}};load();
</script></body></html>
