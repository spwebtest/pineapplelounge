<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pineapple Catchphrase</title><style>*{box-sizing:border-box}body{margin:0;background:#102019;color:#fff8e8;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{text-align:center;color:#f3c84b}section{background:#20382b;border:1px solid #5b7655;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:10px;border-radius:9px;border:0;margin:4px;max-width:100%}button{background:#f3c84b;color:#18271c;font-weight:bold;cursor:pointer}a{color:#f3c84b}#board{position:relative;aspect-ratio:16/9;background:#fff3cf;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#183a29}#art{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(35px,12vw,110px);text-align:center}#art img,#art video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}#tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}#tiles button{margin:0;border:2px solid #f3c84b;border-radius:0;background:#28583e;color:#fff;font-size:clamp(22px,6vw,50px)}#tiles button.open{visibility:hidden}#tiles[hidden],[hidden]{display:none!important}#answer{text-align:center;font-size:24px;font-weight:bold;color:#f3c84b}body.show #host,body.show #home{display:none}body.show main{max-width:1100px}#scores div{display:flex;align-items:center;justify-content:space-between;gap:8px}label{display:block;margin-top:8px}
body{background:radial-gradient(ellipse at 50% 0%,#286849 0%,#102b23 38%,#071510 85%)}
#stage-brand{display:none}
body.show{min-height:100dvh;background:radial-gradient(ellipse at 50% -15%,#3b8055 0%,#133e30 38%,#071b16 75%);overflow-x:hidden}
body.show main{max-width:1280px;width:100%;padding:clamp(8px,2vw,24px)}
body.show h1{display:none}
body.show #stage-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 0 10px;line-height:1}
.brand-top{font-size:clamp(10px,1.5vw,18px);letter-spacing:.32em;font-weight:800;color:#f8e2a1}
.brand-title{font-size:clamp(28px,5.8vw,76px);font-weight:1000;letter-spacing:-.045em;text-transform:uppercase;color:#ffdb63;text-shadow:0 3px 0 #a36a13,0 5px 0 #68410c,0 9px 22px #0009;margin:5px 0 8px}
body.show #stage{position:relative;background:linear-gradient(145deg,#dba93c,#fff0a2 22%,#a56a16 48%,#f6d36b 75%,#a76d1a);border:0;border-radius:clamp(12px,2vw,24px);padding:clamp(5px,1vw,12px);margin:0;box-shadow:0 0 28px #f5c64b38,0 18px 60px #0009}
body.show #stage-inner{background:linear-gradient(155deg,#164b37,#0a261d);padding:clamp(8px,1.6vw,20px);border-radius:clamp(8px,1.5vw,16px);border:1px solid #ffe39a}
body.show #heading{font-size:clamp(12px,2vw,23px);text-transform:uppercase;letter-spacing:.18em;color:#ffe8a4;margin:0 0 12px;font-weight:900}
body.show #board{width:100%;max-height:calc(100dvh - 230px);min-height:120px;aspect-ratio:16/9;margin:auto;background:radial-gradient(ellipse at center,#fffef4,#f7e6b2);border:2px solid #ffda6c;border-radius:10px;box-shadow:inset 0 0 30px #8a5d1722,0 4px 18px #0008}
body.show #art{font-size:clamp(32px,11vw,145px);filter:drop-shadow(0 4px 3px #0002)}
body.show #art:has(img),body.show #art:has(video){filter:none}
body.show #tiles{gap:3px;background:transparent}
body.show #tiles button{background:radial-gradient(ellipse at 50% 10%,#397e57,#164d37 75%);border:1px solid #e9bd58;box-shadow:inset 0 0 0 3px #ffffff12,inset 0 -6px 12px #0004;color:#ffe6a0;font-weight:1000;text-shadow:0 3px 0 #103321,0 4px 10px #0008;font-size:clamp(24px,6vw,70px);transition:filter .15s}
body.show #tiles button:hover{filter:brightness(1.2)}
body.show #answer{background:#09291e;border:1px solid #f4cc68;border-radius:10px;margin:12px 0 0;padding:10px;font-size:clamp(18px,3vw,36px);text-transform:uppercase}
body.show #back{display:block;margin:12px auto 0;background:transparent;border:1px solid #8ba18d;color:#d2e2d5;font-size:12px;padding:6px 12px}
@media(max-height:500px) and (orientation:landscape){body.show main{padding:5px;max-width:calc((100dvh - 100px)*1.78 + 32px)}body.show #stage-brand{margin:0}.brand-title{font-size:26px;margin:2px 0 4px}.brand-top{font-size:9px}body.show #stage-inner{padding:6px}body.show #heading{font-size:12px;margin:0 0 5px}body.show #board{max-height:calc(100dvh - 110px)}body.show #back{margin:4px auto 0;padding:3px 8px}}

body.show{background:radial-gradient(ellipse at 10% 10%,#7629be 0%,transparent 48%),radial-gradient(ellipse at 95% 30%,#005fbd 0%,transparent 55%),linear-gradient(145deg,#160c45,#101a55 60%,#340b56)}
body.show .brand-top{color:#b5f7ff}
body.show .brand-title{color:#ffdf39;text-shadow:0 3px 0 #ff8b18,0 6px 0 #b83779,0 9px 0 #6c2299,0 0 24px #ff51c477;letter-spacing:-.04em}
body.show #stage{background:linear-gradient(125deg,#29e9ff,#8c5bff 28%,#ff46b8 52%,#ffd83d 78%,#28e6ff);box-shadow:0 0 22px #29dfff66,0 0 45px #ef38cb44,0 15px 40px #0008}
body.show #stage-inner{background:linear-gradient(135deg,#25115c,#152e79 65%,#38146e);border:1px solid #b4caff}
body.show #heading{color:#fff;text-shadow:0 0 12px #65dfff;font-weight:900}
body.show #board{border:2px solid #72eaff;background:radial-gradient(ellipse,#fff,#dceaff);box-shadow:0 0 15px #45dcff55}
#tiles,body.show #tiles{gap:0}
#tiles button,body.show #tiles button{margin:0;min-width:0;min-height:0;border:2px solid #b8c9ff;border-radius:0;background:linear-gradient(145deg,#2278ee,#2333a5);color:#fff6b5;box-shadow:inset 0 0 0 3px #ffffff20,inset 0 -8px 14px #0004;text-shadow:0 3px 0 #17245e,0 0 12px #ffdd5270}
body.show #tiles button:nth-child(3n+2){background:linear-gradient(145deg,#a83de8,#5424b3)}
body.show #tiles button:nth-child(3n){background:linear-gradient(145deg,#ed459f,#a51e75)}
body.show #tiles button:nth-child(4),body.show #tiles button:nth-child(9){background:linear-gradient(145deg,#00b6d6,#1261bd)}
body.show #tiles button:nth-child(5){background:linear-gradient(145deg,#ffb62d,#ec681e);color:white;text-shadow:0 3px 0 #9b3518}
body.show #answer{background:linear-gradient(100deg,#6c25be,#c02b91);border-color:#ffe35a;color:#fff5b3}
body.show #back{border-color:#9baeff;color:#dce6ff}
</style></head><body><main><a id="home" href="hidden-games.html">← Host Games</a><h1>🍍 Pineapple Catchphrase</h1><div id="stage-brand"><div class="brand-top">🍍 THE PINEAPPLE LOUNGE</div><div class="brand-title">Catchphrase</div></div><section id="stage"><div id="stage-inner"><h2 id="heading" style="text-align:center">Say what you see!</h2><div id="board"><div id="art"></div><div id="tiles" hidden></div></div><p id="answer" hidden></p></div></section><button id="back" hidden>← Back to host</button><section id="host"><h2>Host controls</h2><label>Choose a starter puzzle</label><select id="pick"></select><button id="load">Load puzzle</button><label>Or upload your own picture, GIF or video</label><input id="file" type="file" accept="image/*,video/*"><input id="custom" placeholder="Correct catchphrase"><button id="upload">Load custom puzzle</button><p id="secret"></p><button id="normal">Normal round</button><button id="bonus">9-square bonus</button><button id="reset">Reset squares</button><button id="reveal">Reveal answer</button><button id="show">Presentation mode</button><h2>Scoreboard</h2><input id="player" placeholder="Player name"><button id="add">Add player</button><div id="scores"></div><button id="clear">Reset scores</button></section></main><script>
if(sessionStorage.getItem('pineappleHostUnlocked')!=='yes'){location.replace('hidden-games.html')}
const $=id=>document.getElementById(id), puzzles=[['When pigs fly','🐷 ☁️ 🪽'],['Spill the beans','🥫 ↘️ 🫘'],['Elephant in the room','🛋️ 🐘 🪴'],['Time flies','🕰️ 🪽'],['Fish out of water','🐟 🏜️'],['Cold feet','🧊 🦶'],['Break the ice','🔨 🧊'],['Walking on eggshells','👣 🥚'],['A piece of cake','🍰'],['Under the weather','🌧️\n🙍'],['Money down the drain','💷 ↘️ 🕳️'],['A wolf in sheep’s clothing','🐺 🐑']];let current=puzzles[0][0],url=null,bonus=false,players=new Map();puzzles.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+p[0];$('pick').append(o)});function tiles(){ $('tiles').replaceChildren();for(let i=1;i<=9;i++){let b=document.createElement('button');b.textContent=i;b.setAttribute('aria-label','Reveal square '+i);b.onclick=()=>b.classList.add('open');$('tiles').append(b)}$('tiles').hidden=!bonus}function fresh(){ $('answer').hidden=true;$('answer').textContent=current;$('secret').textContent='Host answer: '+current;tiles()}function cleanup(){if(url){URL.revokeObjectURL(url);url=null}$('art').replaceChildren()}function load(){cleanup();let p=puzzles[Number($('pick').value)];current=p[0];$('art').textContent=p[1];$('art').style.whiteSpace='pre-line';fresh()}$('load').onclick=load;$('upload').onclick=()=>{let f=$('file').files[0],a=$('custom').value.trim();if(!f||!a){alert('Choose a file and enter its answer.');return}if(!/^(image|video)\//.test(f.type)){alert('Choose an image or video.');return}cleanup();url=URL.createObjectURL(f);let el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=url;if(el.tagName==='VIDEO'){el.autoplay=true;el.loop=true;el.muted=true;el.playsInline=true}else el.alt='Mystery picture';$('art').append(el);current=a;fresh()};$('normal').onclick=()=>{bonus=false;$('heading').textContent='Say what you see!';fresh()};$('bonus').onclick=()=>{bonus=true;$('heading').textContent='Bonus Catchphrase';fresh()};$('reset').onclick=fresh;$('reveal').onclick=()=>{$('answer').hidden=false;$('tiles').querySelectorAll('button').forEach(b=>b.classList.add('open'))};$('show').onclick=()=>{document.body.classList.add('show');$('back').hidden=false;window.scrollTo(0,0)};$('back').onclick=()=>{document.body.classList.remove('show');$('back').hidden=true};function scores(){ $('scores').replaceChildren();[...players].sort((a,b)=>b[1]-a[1]).forEach(([name,points])=>{let row=document.createElement('div'),label=document.createElement('span'),controls=document.createElement('span');label.textContent=name+' — '+points;[-1,1,3,5].forEach(n=>{let b=document.createElement('button');b.textContent=n>0?'+'+n:n;b.onclick=()=>{players.set(name,Math.max(0,players.get(name)+n));scores()};controls.append(b)});row.append(label,controls);$('scores').append(row)})}$('add').onclick=()=>{let n=$('player').value.trim();if(n&&!players.has(n)){players.set(n,0);scores()}$('player').value=''};$('clear').onclick=()=>{if(confirm('Reset all player scores?')){players.forEach((v,k)=>players.set(k,0));scores()}};load();
</script></body></html>
