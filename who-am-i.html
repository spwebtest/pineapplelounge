<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Who Am I? | Pineapple Lounge</title><meta name="round-version" content="manual-roy-20261026-v4"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(145deg,#08150e,#12351f);color:#fff}.wrap{max-width:760px;margin:auto;padding:18px;text-align:center}.back{display:block;text-align:left;color:#fff}.fruit{font-size:42px;margin-top:8px}h1{color:#ffd84d;font-size:clamp(38px,9vw,60px);margin:3px 0}p{opacity:.8}.photo{position:relative;width:min(100%,520px);aspect-ratio:3/4;margin:20px auto;border:7px solid #fff8e7;border-radius:20px;overflow:hidden;background:#222}.photo img{width:100%;height:100%;object-fit:cover}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr)}.tile{display:flex;align-items:center;justify-content:center;background:#173d28;border:2px solid #fff8e7;color:#ffd84d;font-size:26px;font-weight:950;transition:opacity .55s}.tile.off{opacity:0;visibility:hidden;pointer-events:none}.controls{max-width:520px;margin:auto;background:#fffdf5;color:#17251d;padding:17px;border-radius:18px}.status{font-weight:800;margin-bottom:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;min-width:130px;border:0;border-radius:12px;padding:13px;font-weight:850;font-size:15px}.start{background:#ffd84d}.reveal{background:#2d8a52;color:#fff}.reset{background:#e8ece9}.answer{margin-top:12px;font-size:24px;font-weight:950;min-height:34px}.credit{font-size:11px;opacity:.55;margin-top:12px}.credit a{color:#fff}@media(max-width:500px){.photo{aspect-ratio:3/4}.tile{font-size:20px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Games Hub</a><div class="fruit">🍍👤</div><h1>WHO AM I?</h1><p>Guess the mystery celebrity! The host reveals one square at a time.</p><div class="photo"><img src="https://i.postimg.cc/05c2h7Xp/Roy-cropper-jpg.jpg" alt="Mystery celebrity" referrerpolicy="no-referrer"><div id="tiles" class="tiles"></div></div><section class="controls"><div id="status" class="status">25 squares covered</div><div class="buttons"><button id="refresh" class="reveal">↻ CHECK NOW</button></div><div id="answer" class="answer"></div></section><div class="credit">Photo provided by game host</div></main><script>
const REVEALED_COUNT=3; // Host-controlled: increase by one when requested.
const ORDER=[0,12,4,20,24,2,22,10,14,6,18,1,23,5,19,9,15,3,21,11,13,7,17,8,16];
const box=document.getElementById('tiles');
const status=document.getElementById('status');
const answer=document.getElementById('answer');
function render(){
  box.innerHTML='';
  for(let i=0;i<25;i++){
    const d=document.createElement('div');
    d.className='tile';
    d.textContent=i+1;
    box.appendChild(d);
  }
  const revealed=Math.max(0,Math.min(25,REVEALED_COUNT));
  for(let j=0;j<revealed;j++){
    const tile=box.children[ORDER[j]];
    if(tile) tile.classList.add('off');
  }
  if(revealed<25){
    status.textContent=revealed+' of 25 squares revealed';
    answer.textContent='';
  }else{
    status.textContent='All squares revealed';
    answer.textContent='🎉 Roy Cropper (David Neilson)';
  }
}
document.getElementById('refresh').addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.set('refresh',Date.now().toString());location.replace(u.toString());});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
render();

</script></body></html>
